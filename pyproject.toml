[project]
name = "optical-adaptor"
version = "0.1.0"
description = "Render source code as paginated images and run multimodal OCR models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=11.1,<12",
    "pyyaml>=6.0.2,<7",
    "transformers==5.16.1",
    "vllm==0.28.0",
    "torch==2.13.0",
    "accelerate>=1.10,<2",
    "datasets>=4,<5",
    "polars>=1.30,<2",
    "safetensors>=0.8,<1",
    "python-dotenv>=1.2,<2",
    "wandb>=0.21,<1",
    "fonttools>=4.60,<5",
    "pydantic>=2.11,<3",
    "rapidfuzz>=3.14,<4",
    "flash-linear-attention==0.5.2",
]

[project.scripts]
render-code = "optical_adaptor.render_code:main"
ocr-infer = "optical_adaptor.infer_ocr:main"
ocr-edit-distance = "optical_adaptor.edit_distance:main"
ocr-evaluate = "optical_adaptor.evaluate_ocr:main"
prepare-adapter-data = "optical_adaptor.training.data:main"
extract-deepseek-embeddings = "optical_adaptor.training.cache:extract_main"
cache-qwen-teacher = "optical_adaptor.training.cache:teacher_main"
evaluate-adapter = "optical_adaptor.training.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optical_adaptor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".huggingface", ".venv-*", "outputs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
